name: publish · threads

# 매일 23:00 미 동부(ET) — Instagram 보다 2시간 뒤에 올려 두 피드가 겹치지 않게 한다.
# 같은 큐 파일의 .en.threads 문장을 올린다. 글이 본문이고 이미지는 선택이다
# (.en.threadsImages — 없으면 TEXT · 1장이면 IMAGE · 2장 이상이면 CAROUSEL).
# ⚠️ 서머타임: 11월 초 EST 가 되면 22:00 ET 로 당겨진다 — 그때 '0 4 * * *' 로 바꾼다.

on:
  # ⏸ 예약 발행 꺼 둠 (2026-09-20) — Instagram 워크플로와 같이 다시 켠다.
  #    켜는 법: 아래 두 줄의 주석을 풀고 커밋·push.
  # schedule:
  #   - cron: '0 3 * * *' # 03:00 UTC = 23:00 ET(EDT) = 12:00 KST 다음날
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (비우면 오늘 · Asia/Seoul)'
        required: false
        type: string
      dry_run:
        description: '발행하지 않고 점검만'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write # log.md 커밋

concurrency:
  group: dear-sns-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'grohong'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 날짜·모드 결정
        id: prep
        env:
          IN_DATE: ${{ inputs.date }}
          IN_DRY: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          DATE="${IN_DATE:-}"
          if [ -z "$DATE" ]; then DATE="$(TZ=Asia/Seoul date +%F)"; fi
          case "$DATE" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) : ;;
            *) echo "::error::date 형식이 올바르지 않습니다: $DATE"; exit 1 ;;
          esac

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then DRY="${IN_DRY:-true}"; else DRY="false"; fi

          RUN=true
          if [ ! -f "queue/$DATE.json" ]; then
            RUN=false
            echo "::notice::큐 없음 ($DATE) — 오늘은 올릴 게 없습니다."
          elif [ -z "${THREADS_USER_ID:-}" ] || [ -z "${THREADS_TOKEN:-}" ]; then
            # Threads 토큰은 나중에 발급한다. 그때까지 매일 실패 알림이 가지 않도록 경고만 남기고 넘어간다.
            RUN=false
            echo "::warning::THREADS_USER_ID / THREADS_TOKEN 미설정 — Threads 발행을 건너뜁니다."
          fi

          {
            echo "date=$DATE"
            echo "dry=$DRY"
            echo "run=$RUN"
          } >> "$GITHUB_OUTPUT"

      - name: 발행
        if: steps.prep.outputs.run == 'true'
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          # 큐에 .en.threadsImages 가 있을 때만 쓰인다. Meta 가 cURL 로 가져갈 공개 URL.
          ASSET_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/images
          DATE: ${{ steps.prep.outputs.date }}
          DRY: ${{ steps.prep.outputs.dry }}
        run: |
          args=("$DATE")
          if [ "$DRY" = "true" ]; then args+=(--dry-run); fi
          bin/publish_threads.sh "${args[@]}"

      - name: log.md 커밋
        if: steps.prep.outputs.run == 'true' && steps.prep.outputs.dry == 'false'
        env:
          DATE: ${{ steps.prep.outputs.date }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- log.md; then
            echo "log.md 변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log.md
          git commit -m "chore: publish threads $DATE [skip ci]"

          # Instagram 워크플로와 겹쳐 돌면 같은 파일 끝에 각자 한 줄을 붙여 push 가 밀린다.
          # log.md 는 .gitattributes 의 merge=union 이라 rebase 가 양쪽 줄을 모두 남긴다.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            echo "push 거절 — 원격을 받아 다시 시도합니다 ($attempt/3)"
            git pull --rebase origin "$BRANCH" || git rebase --abort || true
          done
          echo "::error::log.md 를 push 하지 못했습니다. **게시물은 이미 올라갔습니다** — 기록만 손으로 남기세요."
          exit 1
