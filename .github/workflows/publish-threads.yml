name: publish · threads

# 매일 23:00 KST — Instagram 보다 2시간 뒤에 올려 두 피드가 겹치지 않게 한다.
# 같은 큐 파일의 .ko.threads 문장을 이미지 없이 텍스트로만 올린다 (브랜드 가이드 §4.1).

on:
  schedule:
    - cron: '0 14 * * *' # 14:00 UTC = 23:00 KST
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (비우면 오늘 · Asia/Seoul)'
        required: false
        type: string
      dry_run:
        description: '발행하지 않고 점검만'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write # log.md 커밋

concurrency:
  group: dear-sns-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'grohong'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 날짜·모드 결정
        id: prep
        env:
          IN_DATE: ${{ inputs.date }}
          IN_DRY: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          DATE="${IN_DATE:-}"
          if [ -z "$DATE" ]; then DATE="$(TZ=Asia/Seoul date +%F)"; fi
          case "$DATE" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) : ;;
            *) echo "::error::date 형식이 올바르지 않습니다: $DATE"; exit 1 ;;
          esac

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then DRY="${IN_DRY:-true}"; else DRY="false"; fi

          RUN=true
          if [ ! -f "queue/$DATE.json" ]; then
            RUN=false
            echo "::notice::큐 없음 ($DATE) — 오늘은 올릴 게 없습니다."
          elif [ -z "${THREADS_USER_ID:-}" ] || [ -z "${THREADS_TOKEN:-}" ]; then
            # Threads 토큰은 나중에 발급한다. 그때까지 매일 실패 알림이 가지 않도록 경고만 남기고 넘어간다.
            RUN=false
            echo "::warning::THREADS_USER_ID / THREADS_TOKEN 미설정 — Threads 발행을 건너뜁니다."
          fi

          {
            echo "date=$DATE"
            echo "dry=$DRY"
            echo "run=$RUN"
          } >> "$GITHUB_OUTPUT"

      - name: 발행
        if: steps.prep.outputs.run == 'true'
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DATE: ${{ steps.prep.outputs.date }}
          DRY: ${{ steps.prep.outputs.dry }}
        run: |
          args=("$DATE")
          if [ "$DRY" = "true" ]; then args+=(--dry-run); fi
          bin/publish_threads.sh "${args[@]}"

      - name: log.md 커밋
        if: steps.prep.outputs.run == 'true' && steps.prep.outputs.dry == 'false'
        env:
          DATE: ${{ steps.prep.outputs.date }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- log.md; then
            echo "log.md 변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log.md
          git commit -m "chore: publish threads $DATE [skip ci]"
          git push origin "HEAD:$BRANCH" || {
            git pull --rebase --autostash origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          }
